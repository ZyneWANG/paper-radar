name: paper-radar

on:
  schedule:
    - cron: '0 1 * * 1'        # 每周一 01:00 UTC（北京时间周一 09:00）自动运行
  workflow_dispatch: {}        # 允许在 GitHub 网页手动触发

permissions:
  contents: write              # 允许运行结束后把去重记录、网页归档 commit 回仓库

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch, rank, render and send
        env:
          # 核心
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RESEARCH_INTEREST: ${{ secrets.RESEARCH_INTEREST }}
          SCORE_THRESHOLD: ${{ secrets.SCORE_THRESHOLD }}
          MAX_PICK: ${{ secrets.MAX_PICK }}
          # 邮件
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_AUTH_CODE: ${{ secrets.SENDER_AUTH_CODE }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          # OpenAlex
          OPENALEX_KEY: ${{ secrets.OPENALEX_KEY }}
          OPENALEX_QUERIES: ${{ secrets.OPENALEX_QUERIES }}
          OPENALEX_DAYS: ${{ secrets.OPENALEX_DAYS }}
          OPENALEX_PER_QUERY: ${{ secrets.OPENALEX_PER_QUERY }}
          # 飞书
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # 渠道开关
          ENABLE_EMAIL: ${{ secrets.ENABLE_EMAIL }}
          ENABLE_FEISHU: ${{ secrets.ENABLE_FEISHU }}
        run: python main.py

      - name: Commit seen state and web archive
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "paper-radar-bot@users.noreply.github.com"
          git add seen.json docs
          if git diff --staged --quiet; then
            echo "没有需要保存的变化"
          else
            git commit -m "chore: save seen state and archive [skip ci]"
            git push
          fi
