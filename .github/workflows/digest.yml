name: paper-radar

on:
  schedule:
    - cron: '0 1 * * 1'        # 每周一 01:00 UTC（北京时间周一 09:00）自动运行
  workflow_dispatch: {}        # 允许在 GitHub 网页手动触发

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch, rank, render and send
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RESEARCH_INTEREST: ${{ secrets.RESEARCH_INTEREST }}
          SCORE_THRESHOLD: ${{ secrets.SCORE_THRESHOLD }}
          MAX_PICK: ${{ secrets.MAX_PICK }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_AUTH_CODE: ${{ secrets.SENDER_AUTH_CODE }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py
